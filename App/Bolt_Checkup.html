<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bolt Checkup</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #141a24;
      --panel-2: #1a2230;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --line: rgba(255,255,255,0.08);
      --ready: #3dd68c;
      --partial: #f5c542;
      --shell: #ff6b6b;
      --idea: #9aa4b5;
      --accent: #6ea8ff;
      --glow: rgba(110,168,255,0.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: clip;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(110,168,255,0.18), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(61,214,140,0.12), transparent 55%),
        var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 48px; }
    header {
      display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
      gap: 12px; margin-bottom: 24px;
    }
    h1 {
      margin: 0; font-size: 1.75rem; letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 10px;
    }
    h1 span.bolt { color: var(--accent); text-shadow: 0 0 18px var(--glow); }
    .meta { color: var(--muted); font-size: 0.92rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .card {
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .card .label {
      color: var(--muted); font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 8px;
    }
    .card .value {
      font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em;
    }
    .card .sub { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .panel {
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .panel h2 {
      margin: 0 0 14px; font-size: 1rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }
    .key {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-radius: 12px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--line);
      font-size: 0.92rem;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    }
    .dot.on { background: var(--ready); box-shadow: 0 0 10px rgba(61,214,140,0.55); }
    .dot.off { background: var(--shell); box-shadow: 0 0 10px rgba(255,107,107,0.4); }
    .phases { display: flex; flex-wrap: wrap; gap: 8px; }
    .phase {
      padding: 8px 12px; border-radius: 999px; font-size: 0.85rem;
      border: 1px solid var(--line); color: var(--muted);
    }
    .phase.done { color: var(--ready); border-color: rgba(61,214,140,0.35); background: rgba(61,214,140,0.08); }
    .phase.active { color: var(--partial); border-color: rgba(245,197,66,0.4); background: rgba(245,197,66,0.1); }
    .top-clip {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
      justify-content: space-between;
    }
    .top-clip .title { font-size: 1.15rem; font-weight: 650; }
    .badge {
      display: inline-block; padding: 6px 10px; border-radius: 999px;
      background: rgba(110,168,255,0.15); color: var(--accent);
      font-weight: 600; font-size: 0.85rem;
    }
    .empty {
      color: var(--muted); padding: 24px; text-align: center;
      border: 1px dashed var(--line); border-radius: 16px;
    }
    footer {
      margin-top: 22px; color: var(--muted); font-size: 0.8rem;
      display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between;
    }
    code { color: var(--accent); }
    .morning-head {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    }
    .morning-head img {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    }
    .morning-head h2 {
      margin: 0; color: var(--text); text-transform: none; letter-spacing: -0.02em;
      font-size: 1.15rem;
    }
    .morning-grid {
      display: grid; gap: 12px; grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .morning-grid { grid-template-columns: 1fr 1fr; }
    }
    .morning .block {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .morning .block h3 {
      margin: 0 0 8px; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); font-weight: 600;
    }
    .morning .title { font-weight: 650; }
    .morning ul { margin: 6px 0 0; padding-left: 18px; }
    .morning li { margin: 4px 0; }
    .muted-line { color: var(--muted); font-size: 0.9rem; margin: 0; }
    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 0.78rem; font-weight: 650; white-space: nowrap;
    }
    .pill.good { color: var(--ready); background: rgba(61,214,140,0.12); }
    .pill.mid { color: var(--partial); background: rgba(245,197,66,0.12); }
    .pill.bad { color: var(--shell); background: rgba(255,107,107,0.12); }
    .pill.status {
      margin-left: 6px; font-weight: 600; text-transform: lowercase;
      color: var(--muted); background: rgba(255,255,255,0.06);
    }
    .pill.status.ready { color: var(--ready); background: rgba(61,214,140,0.12); }
    .pill.status.queued { color: var(--partial); background: rgba(245,197,66,0.12); }
    .stale {
      color: var(--partial); font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.06em; margin-left: 6px;
    }
    .clip-row, .action-row {
      display: flex; justify-content: space-between; gap: 10px;
      align-items: flex-start; margin-top: 8px;
    }
    .morning-foot {
      margin-top: 14px; color: var(--muted); font-size: 0.85rem;
      display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between;
    }
    .morning a { color: var(--accent); }
    .review-card .top-list { margin: 8px 0 0; padding-left: 18px; }
    .review-card li { margin: 4px 0; }
    .review-card {
      position: relative;
      isolation: isolate;
      overflow: visible;
      margin: 36px 0 32px;
      padding: 72px 10% 56px;
      color: #2c1a22;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      animation: cloud-float 8.4s ease-in-out infinite;
      animation-delay: -2.2s;
    }

      filter: drop-shadow(0 0 10px rgba(255, 190, 110, 0.7));
    }
    .review-card::after { content: none; }
    .review-card > * { position: relative; z-index: 1; }
    .review-card h2,
    .review-card .morning-head h2 { color: #2c1a22; }
    .review-card .meta,
    .review-card .muted-line,
    .review-card li { color: #5c3d4c; }
    .review-card code { color: #163f86; }
    .review-card .pill.good { color: #0b6a3c; background: rgba(11, 106, 60, 0.14); }
    .review-card .pill.mid { color: #7a4e00; background: rgba(180, 120, 20, 0.18); }
    .review-card .pill.bad { color: #9d1c32; background: rgba(157, 28, 50, 0.12); }
    .review-card :focus-visible {
      outline: 2px solid #fffaf3;
      outline-offset: 2px;
      box-shadow: 0 0 0 4px #6a3d12;
    }
    @keyframes cloud-float {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -8px, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .review-card { animation: none; }
    }

<body>
  <div class="wrap">
    <header>
      <div>
        <h1><span class="bolt">⚡</span> Bolt Checkup</h1>
        <div class="meta" id="generated">Loading live stats…</div>
      </div>
      <div class="meta">Local dashboard · refreshes when data is rewritten</div>
    </header>

    <div id="error" class="empty" style="display:none"></div>

    <div id="dash" style="display:none">
      <section class="panel morning" id="morning" hidden></section>
      <section class="panel morning review-card" id="review-card" hidden></section>

      <div class="grid" id="stats"></div>

      <div class="panel">
        <h2>Top clip in queue</h2>
        <div class="top-clip" id="top-clip"></div>
      </div>

      <div class="panel">
        <h2>API / integration keys</h2>
        <div class="keys" id="keys"></div>
      </div>

      <div class="panel">
        <h2>Build phase</h2>
        <div class="phases" id="phases"></div>
      </div>
    </div>

    <footer>
      <span>Data file: <code>Data/Bolt_data.js</code> (via Checkup_Writer)</span>
      <span>Refresh: <code>bolt checkup</code> · open: <code>bolt checkup --open</code></span>
    </footer>
  </div>

  <script src="../Data/Bolt_data.js"></script>
  <script>
    (function () {
      var err = document.getElementById("error");
      var dash = document.getElementById("dash");
      var data = window.Bolt_DATA;

      if (!data) {
        err.style.display = "block";
        err.innerHTML =
          "No <code>window.Bolt_DATA</code> found.<br/>Run <code>bolt checkup</code> to write <code>Data/Bolt_data.js</code>, then reload this page.";
        return;
      }

      dash.style.display = "block";
      document.getElementById("generated").textContent =
        "Updated " + (data.generated_at || "unknown");
      renderMorning(data);
      renderReview(data);

      function fmt(n) {
        if (n === null || n === undefined) return "—";
        if (typeof n === "number") return n.toLocaleString();
        return String(n);
      }

      var cards = [
        { label: "Clips made", value: data.clips_made },
        { label: "Vertical clips", value: data.vertical_clips },
        { label: "Ready to post", value: data.ready_to_post },
        { label: "Avg score", value: data.avg_score },
        { label: "Highlights", value: data.highlights },
        { label: "Titles in queue", value: data.titles_generated },
        { label: "Recordings done", value: data.recordings_processed },
        { label: "Clips posted", value: data.clips_posted },
        { label: "Total views", value: data.total_views },
        { label: "Total likes", value: data.total_likes }
      ];

      var stats = document.getElementById("stats");
      stats.innerHTML = cards.map(function (c) {
        return (
          '<div class="card"><div class="label">' + c.label +
          '</div><div class="value">' + fmt(c.value) + "</div></div>"
        );
      }).join("");

      var top = document.getElementById("top-clip");
      if (data.top_clip && data.top_clip.title) {
        top.innerHTML =
          '<div><div class="title">' + escapeHtml(data.top_clip.title) +
          '</div><div class="meta">' + escapeHtml(data.top_clip.path || "") +
          "</div></div><span class=\"badge\">score " +
          fmt(data.top_clip.score) + "</span>";
      } else {
        top.innerHTML = '<div class="meta">Queue is empty — process a recording or check ready_to_post.json.</div>';
      }

      var keys = data.api_keys || {};
      var keysEl = document.getElementById("keys");
      var labels = {
        twitch: "Twitch",
        obs: "OBS",
        streamlabs: "Streamlabs",
        discord: "Discord",
        openai: "OpenAI",
        xai: "xAI / Grok",
        tiktok: "TikTok",
        bot_token: "Twitch bot"
      };
      keysEl.innerHTML = Object.keys(labels).map(function (k) {
        var on = !!keys[k];
        return (
          '<div class="key"><span class="dot ' + (on ? "on" : "off") +
          '"></span>' + labels[k] + "</div>"
        );
      }).join("");

      var phase = data.phase || {};
      var phasesEl = document.getElementById("phases");
      var items = [
        { label: "Phase 1", done: phase.p1_done },
        { label: "Phase 2", done: phase.p2_done },
        { label: "Phase 3", done: phase.p3_active, active: true },
        { label: "Phase 4", done: phase.p4_done }
      ];
      phasesEl.innerHTML = items.map(function (p) {
        var cls = "phase";
        if (p.done && !p.active) cls += " done";
        if (p.active && phase.p3_active) cls += " active";
        if (p.label === "Phase 4" && p.done) cls += " done";
        var current = phase.current ? " · current " + phase.current : "";
        return '<span class="' + cls + '">' + p.label +
          (p.label === "Phase 3" ? current : "") + "</span>";
      }).join("");

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderMorning(data) {
        var el = document.getElementById("morning");
        if (!el) return;
        if (!data || !data.morning || typeof data.morning !== "object") {
          el.hidden = true;
          return;
        }
        var morning = data.morning;
        el.hidden = false;
        var lanes = Array.isArray(morning.lanes) ? morning.lanes.join(", ") : "";
        var html = "";
        html += '<div class="morning-head">';
        html += '<img src="assets/menu_bar_icon.png" alt="" />';
        html += "<div><h2>⚡ Good Morning Bolt</h2>";
        html += '<div class="meta">' + escapeHtml(morning.greeting || "Good morning") ;
        if (morning.date) html += " · " + escapeHtml(morning.date);
        if (lanes) html += " · " + escapeHtml(lanes);
        html += "</div></div></div>";
        html += '<div class="morning-grid">';
        html += morningBlock("Today's mission", renderMission(morning.mission));
        html += morningBlock("Next clips to post", renderClips(morning.clips));
        html += morningBlock("Research picks", renderResearch(morning.research));
        html += morningBlock("Next actions", renderActions(morning.actions));
        html += "</div>";
        html += '<div class="morning-foot"><span>' +
          escapeHtml(morning.footer || "All posts still need your approval.") +
          "</span>";
        if (morning.briefing_href) {
          html += '<a href="' + escapeHtml(morning.briefing_href) +
            '">Spoken briefing</a>';
        }
        html += "</div>";
        el.innerHTML = html;
      }

      function renderReview(data) {
        var el = document.getElementById("review-card");
        if (!el) return;
        var review = data && data.review;
        if (!review || typeof review !== "object") {
          el.hidden = true;
          return;
        }
        el.hidden = false;
        if (review.error) {
          el.innerHTML = '<div class="morning-head"><img src="assets/menu_bar_icon.png" alt="" />' +
            '<div><h2>Clip review</h2></div></div>' +
            '<p class="muted-line">Couldn\'t read the clip queue.</p>';
          return;
        }
        var counts = review.counts || {};
        var summary = "Ready " + (counts.ready || 0) +
          " · Held " + (counts.held || 0) +
          " · Posted " + (counts.posted || 0) +
          " · Scrapped " + (counts.scrapped || 0);
        var html = '<div class="morning-head"><img src="assets/menu_bar_icon.png" alt="" />';
        html += "<div><h2>Clip review</h2>";
        html += '<div class="meta">' + escapeHtml(summary) + "</div></div></div>";
        if (review.empty) {
          html += '<p class="muted-line">' + escapeHtml(review.hint || "No clips in the queue yet.") + "</p>";
        } else if (review.hint) {
          html += '<p class="muted-line">' + escapeHtml(review.hint) + "</p>";
        }
        var top = review.top || [];
        if (top.length) {
          html += '<ul class="top-list">';
          top.forEach(function (clip) {
            var line = clip.title || "Untitled clip";
            if (clip.status) line += " · " + clip.status;
            html += "<li>" + escapeHtml(line);
            if (clip.score !== null && clip.score !== undefined && clip.score !== "") {
              html += " " + scorePill(clip.score);
            }
            html += "</li>";
          });
          html += "</ul>";
        }
        html += '<p class="muted-line">Run <code>bolt review</code> to keep/toss.</p>';
        el.innerHTML = html;
      }

      function morningBlock(title, body) {
        return '<div class="block"><h3>' + escapeHtml(title) + "</h3>" + body + "</div>";
      }

      function couldntRead(label) {
        return '<p class="muted-line">Couldn\'t read ' + escapeHtml(label) + ".</p>";
      }

      function renderMission(section) {
        try {
          if (!section || section.error) return couldntRead("mission");
          if (section.empty) return '<p class="muted-line">' + escapeHtml(section.hint || "No mission yet. Run `bolt mission`.") + "</p>";
          var html = '<div class="title">' + escapeHtml(section.title || "Mission");
          if (section.stale) html += '<span class="stale">stale</span>';
          html += "</div>";
          if (section.date) html += '<div class="sub">' + escapeHtml(section.date) + "</div>";
          var actions = section.actions || [];
          if (actions.length) {
            html += "<ul>";
            actions.forEach(function (line) {
              html += "<li>" + escapeHtml(line) + "</li>";
            });
            html += "</ul>";
          }
          html += commandHtml(section.command);
          return html;
        } catch (err) {
          return couldntRead("mission");
        }
      }

      function renderClips(section) {
        try {
          if (!section || section.error) return couldntRead("clips");
          if (section.empty) return '<p class="muted-line">' + escapeHtml(section.hint || "Queue is empty. Run the clip pipeline / `bolt checkup` after processing.") + "</p>";
          var counts = section.counts || {};
          var summary = section.summary || (
            "Ready " + (counts.ready || 0) +
            " · In queue " + (counts.other || 0) +
            " · Posted " + (counts.posted || 0)
          );
          var html = '<div class="sub">' + escapeHtml(summary) + "</div>";
          (section.clips || []).forEach(function (clip) {
            var state = clip.status === "ready" ? "ready" : "queued";
            html += '<div class="clip-row"><div><div>' + escapeHtml(clip.title || "Untitled clip") +
              ' <span class="pill status ' + state + '">' + escapeHtml(state) + "</span></div>";
            var meta = clip.file || "";
            if (clip.platform) meta += (meta ? " · " : "") + clip.platform;
            if (meta) html += '<div class="sub">' + escapeHtml(meta) + "</div>";
            html += "</div>" + scorePill(clip.score) + "</div>";
          });
          return html;
        } catch (err) {
          return couldntRead("clips");
        }
      }

      function scorePill(score) {
        if (score === null || score === undefined || score === "") return "";
        var n = Number(score);
        var cls = "bad";
        if (n >= 75) cls = "good";
        else if (n >= 50) cls = "mid";
        var label = (Math.round(n * 10) / 10).toString();
        return '<span class="pill ' + cls + '">' + escapeHtml(label) + "</span>";
      }

      function renderResearch(section) {
        try {
          if (!section || section.error) return couldntRead("research");
          if (section.empty) return '<p class="muted-line">' + escapeHtml(section.hint || "No research picks yet. `bolt research find`") + "</p>";
          var counts = section.counts || {};
          var html = '<div class="sub">Kept ' + escapeHtml(counts.kept || 0) +
            " · Dropped " + escapeHtml(counts.dropped || 0) +
            " · Pending C5 " + escapeHtml(counts.pending_c5 || 0) +
            " · Blocked C7 " + escapeHtml(counts.blocked_c7 || 0) + "</div>";
          html += pickList("Kept", section.kept);
          html += pickList("Pending", section.pending);
          return html;
        } catch (err) {
          return couldntRead("research");
        }
      }

      function pickList(label, rows) {
        if (!rows || !rows.length) return "";
        var html = '<div class="sub" style="margin-top:8px">' + escapeHtml(label) + "</div><ul>";
        rows.forEach(function (row) {
          var line = row.name || "";
          if (row.platform) line += " · " + row.platform;
          if (row.verdict && row.verdict !== "fits" && row.verdict !== "pending") {
            line += " · " + row.verdict;
          }
          html += "<li>" + escapeHtml(line) + "</li>";
        });
        html += "</ul>";
        return html;
      }

      function renderActions(section) {
        try {
          if (!section || section.error) return couldntRead("next actions");
          if (section.empty) return '<p class="muted-line">' + escapeHtml(section.hint || "Nothing queued. `bolt manage add …`") + "</p>";
          var html = '<div class="sub">Testing: ' + escapeHtml(section.testing || 0) + "</div>";
          (section.items || []).forEach(function (action) {
            html += '<div class="action-row"><div><div>' + escapeHtml(action.title || "") +
              "</div>";
            if (action.why) html += '<div class="sub">' + escapeHtml(action.why) + "</div>";
            html += commandHtml(action.command);
            html += "</div></div>";
          });
          if (section.advance && section.advance.title) {
            html += '<div class="sub" style="margin-top:8px">Advance</div>';
            html += "<div>" + escapeHtml(section.advance.title) + "</div>";
            html += commandHtml(section.advance.command);
          }
          if (section.lesson) {
            html += '<div class="sub" style="margin-top:8px">' + escapeHtml(section.lesson) + "</div>";
          }
          return html;
        } catch (err) {
          return couldntRead("next actions");
        }
      }

      function commandHtml(command) {
        if (!command) return "";
        var lines = String(command).split("\n").filter(function (line) { return line.trim(); });
        return lines.map(function (line) {
          return "<div><code>" + escapeHtml(line.trim()) + "</code></div>";
        }).join("");
      }
    })();
  </script>
</body>
