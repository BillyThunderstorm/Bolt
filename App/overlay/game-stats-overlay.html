<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bolt Reactive Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="overlay">

    <div class="stat-box kills">
        <div class="label">KILLS</div>
        <div class="number" id="kills">0</div>
        <div class="tally-container" id="kill-tallies"></div>
    </div>

    <div class="stat-box wins">
        <div class="label">WINS</div>
        <div class="number" id="wins">0</div>
    </div>

    <div class="stat-box deaths">
        <div class="label">DEATHS</div>
        <div class="number" id="deaths">0</div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
