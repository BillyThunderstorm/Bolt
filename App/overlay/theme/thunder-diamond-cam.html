<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thunder Diamond Cam Frame</title>
<!--
  OBS Browser Source (must be the http URL from `bolt overlay`, not Local File)
  --------------------------------------------------------------------------
  URL:    http://127.0.0.1:8766/thunder-diamond-cam.html
  Wide:   http://127.0.0.1:8766/thunder-diamond-cam.html?shape=wide
  Size:   match your webcam source (square for round frame)
  CSS:    body { background-color: rgba(0,0,0,0) !important; }

  Layer order: gameplay → webcam → this frame (on top of the webcam).
  A kill/win from Stream Deck flashes the ring.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  body.bg-check {
    background:
      repeating-conic-gradient(#2a2a2a 0% 25%, #1a1a1a 0% 50%)
      0 0 / 28px 28px;
  }
  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    transform-origin: 50% 50%;
  }
  .ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 0 18px rgba(80, 140, 255, 0.35));
  }
  .flash {
    position: absolute;
    inset: 18%;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.55), transparent 62%);
    mix-blend-mode: screen;
  }
  .frame.react { animation: frame-kick 480ms cubic-bezier(.18,.9,.22,1.15); }
  .frame.react .ring { animation: ring-strike 560ms ease-out; }
  .frame.react .flash { animation: hole-flash 480ms ease-out; }

  @keyframes frame-kick {
    0% { transform: scale(1); }
    30% { transform: scale(1.035); }
    100% { transform: scale(1); }
  }
  @keyframes ring-strike {
    0% { filter: drop-shadow(0 0 18px rgba(80, 140, 255, 0.35)) brightness(1); }
    22% { filter: drop-shadow(0 0 28px rgba(180, 90, 255, 0.95)) brightness(1.55) saturate(1.35); }
    100% { filter: drop-shadow(0 0 18px rgba(80, 140, 255, 0.35)) brightness(1); }
  }
  @keyframes hole-flash {
    0% { opacity: 0; }
    18% { opacity: 0.9; }
    100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .frame.react, .frame.react .ring, .frame.react .flash { animation-duration: 1ms; }
  }
</style>
</head>
<body>
  <div class="frame" id="frame">
    <img class="ring" id="ring" alt="">
    <div class="flash"></div>
  </div>
<script>
  var params = new URLSearchParams(location.search);
  var wide = params.get("shape") === "wide";
  document.getElementById("ring").src = wide
    ? "assets/thunder-diamond-cam-wide.png"
    : "assets/thunder-diamond-cam.png";
  if (params.get("bg") === "check") document.body.classList.add("bg-check");

  var last = { kills: 0, wins: 0 };
  var primed = false;
  var serverMode = location.protocol.indexOf("http") === 0;

  function flash() {
    var frame = document.getElementById("frame");
    frame.classList.remove("react");
    void frame.offsetWidth;
    frame.classList.add("react");
  }

  function apply(payload) {
    var next = (payload && payload.counts) || last;
    var counts = { kills: next.kills || 0, wins: next.wins || 0 };
    if (!primed) {
      last = counts;
      primed = true;
      return;
    }
    var dk = counts.kills - last.kills;
    var dw = counts.wins - last.wins;
    last = counts;
    if (dk > 0 || dw > 0) flash();
  }

  function poll() {
    fetch("/api/state", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(apply)
      .catch(function () {});
  }

  if (params.get("demo") === "1") {
    setTimeout(flash, 400);
  }

  if (serverMode) {
    poll();
    setInterval(poll, 280);
  }
</script>
</body>
</html>
