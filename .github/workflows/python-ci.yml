name: Bolt Python CI

# Real app checks: install deps, CLI boots, unit tests.
# This is separate from the live websites (Cloudflare Pages + Worker).
# Site data is published via `bolt site` / site_data_writer.py → GitHub → API Worker.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Install + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PortAudio (for PyAudio / SpeechRecognition)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python from .python-version
        run: uv python install

      - name: Install project dependencies
        run: uv sync --frozen
        # Fall back if lock is out of date with CI Python
        continue-on-error: false

      - name: CLI smoke (bolt help)
        run: |
          uv run bolt help
          uv run bolt version
          uv run bolt budget

      - name: Unit tests
        env:
          # Keep CI free of paid API calls; tests should mock or use templates
          BOLT_LLM_MODE: local
          BOLT_LLM_PROVIDER: ollama
          BOLT_LLM_FALLBACK: none
          BOLT_USE_WHISPER: "false"
          BOLT_STT_PROVIDER: google
          BOLT_SPEAK: "0"
          Bolt_VOICE_MUTE: "true"
          NEXUS_ALLOW_PAID: "false"
          USE_GEMINI_TITLES: "false"
          # Avoid accidental key use even if secrets are present in forks
          XAI_API_KEY: ""
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
        run: |
          uv run python -m unittest discover -s Data/tests -t . -v
