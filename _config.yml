# Minimal Jekyll config for the legacy "Jekyll site CI" workflow only.
#
# Production sites are NOT built here — they live on Cloudflare Pages and
# pull live JSON from the api.billythunderstorm.us Worker (fed by
# `bolt site` / scripts/site_data_writer.py → site-data.json on GitHub).
#
# This file exists so Jekyll CI does not crawl Python/scripts trees.

title: Bolt
exclude:
  - scripts
  - Core
  - Data
  - media
  - Media
  - App
  - bin
  - bolt_cli
  - logs
  - 3rd_Party
  - node_modules
  - .venv
  - .venv-1
  - venv
  - env
  - llm-env
  - google-cloud-sdk
  - dist
  - build
  - archive
  - _Archive
  - vendor
  - Gemfile
  - Gemfile.lock
  - "*.py"
  - "*.pyc"
  - pyproject.toml
  - uv.lock
  - .git
  - .github
  - .grok
